<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img"><title>虚构订单字段示意，不是真实价格或截图</title><rect width="900" height="510" rx="20" fill="#e0eee7"/><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><text x="46" y="62" fill="#28745a" font-size="29">付款页里，重点看这几个字段</text><text x="46" y="100" fill="#536b5e" font-size="17">原创虚构示意 · 不是真实产品价格，也不是付款截图</text><rect x="46" y="132" width="808" height="322" rx="18" fill="white" stroke="#c1d2c8"/><text x="76" y="181" fill="#28745a" font-size="23">商品名称    教学示例订阅</text><text x="76" y="229" fill="#28745a" font-size="23">计费周期    每月</text><text x="76" y="277" fill="#28745a" font-size="23">标价            20 USD / 月</text><text x="76" y="325" fill="#28745a" font-size="23">总价            以实际订单、税费与汇率为准</text><text x="76" y="373" fill="#28745a" font-size="23">续费 / 取消入口 / 退款规则    分别记录</text><text x="76" y="418" fill="#536b5e" font-size="17">20 × 12 = 240 USD，仅演示连续十二个月的标价计算。</text></g></svg>